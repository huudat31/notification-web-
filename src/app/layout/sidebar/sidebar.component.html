<aside class="sidebar">
    <!-- Logo -->
    <div class="sidebar__logo">
        <div class="sidebar__logo-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="m3 11 19-9-9 19-2-8-8-2z" />
            </svg>
        </div>
        <div class="sidebar__logo-text">
            <span class="sidebar__logo-name">NotifyAdmin</span>
            <span class="sidebar__logo-sub">Marketing Ops</span>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="sidebar__nav">
        <a *ngFor="let item of navItems" [routerLink]="item.route" routerLinkActive="sidebar__nav-item--active"
            class="sidebar__nav-item">
            <span class="sidebar__nav-icon" [innerHTML]="item.iconPath"></span>
            <span class="sidebar__nav-label">{{ item.label }}</span>
        </a>
    </nav>

    <!-- Footer -->
    <div class="sidebar__footer">
        <!-- User Card -->
        <div class="sidebar__user-card">
            <div class="sidebar__user-avatar">JD</div>
            <div class="sidebar__user-info">
                <span class="sidebar__user-name">Jane Doe</span>
                <span class="sidebar__user-role">Admin</span>
            </div>
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" class="sidebar__chevron">
                <path d="m6 9 6 6 6-6" />
            </svg>
        </div>

        <!-- Actions -->
        <div class="sidebar__actions">
            <a href="#" class="sidebar__action-link">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10" />
                    <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />
                    <path d="M12 17h.01" />
                </svg>
                <span>Support</span>
            </a>
            <button class="sidebar__action-link" (click)="logout()">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                    <polyline points="16 17 21 12 16 7" />
                    <line x1="21" y1="12" x2="9" y2="12" />
                </svg>
                <span>Logout</span>
            </button>
        </div>
    </div>
</aside>

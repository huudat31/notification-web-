<div class="toolbar-card">
  <!-- Status Tabs -->
  <div class="status-tabs">
    <button *ngFor="let tab of statusTabs" class="tab-btn" [class.tab-btn--active]="activeStatus === tab.value"
      (click)="selectStatus(tab.value)">
      {{ tab.label }}
    </button>
  </div>

  <!-- Search Input -->
  <div class="search-box">
    <input type="text" [formControl]="searchControl" placeholder="Tìm kiếm campaign..." class="search-input"
      id="campaign-search-input" />
    <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
      stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
  </div>

  <!-- Sort Dropdown -->
  <div class="filter-item">
    <span class="filter-label">Sắp xếp:</span>
    <select [formControl]="sortControl" class="filter-select" id="campaign-sort-select">
      <option value="DESC">Mới nhất</option>
      <option value="ASC">Cũ nhất</option>
    </select>
  </div>
</div>

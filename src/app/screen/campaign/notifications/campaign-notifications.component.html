@if (pageService.campaignQuery.data(); as campaign) {
<div class="dashboard-shell">

  <!-- HEADER -->
  <header class="page-header">
    <div class="header-top">
      <nav class="breadcrumb">
        <span [routerLink]="['/campaigns']" class="breadcrumb-item link">Campaigns</span>
        <svg class="chevron" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
        <span class="breadcrumb-item link" [routerLink]="['/campaigns']">{{ campaign.name }}</span>
        <svg class="chevron" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
        <span class="breadcrumb-item active">Notifications</span>
      </nav>
    </div>

    <div class="header-bottom">
      <div class="title-container">
        <button class="back-btn" [routerLink]="['/campaigns']" title="Back to Campaigns">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
        </button>
        <div class="title-group">
          <h1 class="page-title">Campaign Notifications</h1>
          <p class="page-subtitle">
            Showing total <span class="count-badge">{{ pageService.state().totalElements }}</span> notifications sent
            for this campaign.
          </p>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn-primary" [routerLink]="['/campaigns/create']">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          New Notification
        </button>
      </div>
    </div>
  </header>

  <app-campaign-overview-cards />

  <app-notification-filter-bar [activeFilters]="pageService.filters()" (filterChange)="onFilterChange($event)"
    (refresh)="refresh()" />

  <main class="page-content">
    <div class="card notification-card">
      <app-notification-list [notifications]="pageService.state().notifications"
        [isLoading]="pageService.state().isLoading" (viewDetails)="openDetail($event)"
        (retryNotification)="onRetry($event)" (listScrolled)="onScrollIndexChange($event)" />

      @if (pageService.state().isFetchingNextPage) {
      <div class="infinite-scroll-loading">
        <div class="spinner"></div>
        <span>Loading more notifications...</span>
      </div>
      }
    </div>
  </main>

  <app-notification-detail-drawer [isOpen]="isDrawerOpen" [notification]="selectedNotification"
    (closeDrawer)="closeDetail()" />

</div>
}

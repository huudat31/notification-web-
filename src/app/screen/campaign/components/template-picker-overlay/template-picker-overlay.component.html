<div class="picker-backdrop" (click)="onBackdropClick($event)">
  <div class="picker-dialog">

    
    <div class="picker-header">
      <h2 class="picker-title">Chọn Template</h2>
      <button class="btn-close" (click)="onClose()" title="Đóng (ESC)">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    
    <div class="picker-search">
      <div class="search-input-wrap">
        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input #searchInput type="text" class="search-input" [formControl]="searchControl"
          placeholder="Tìm kiếm template theo tên hoặc tiêu đề..." />

        <button *ngIf="searchControl.value" class="btn-clear-search" (click)="clearSearch()">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>

    
    <div class="picker-content" *ngIf="{ templates: filteredTemplates$ | async } as data">

      
      <ng-container *ngIf="isLoading">
        <div class="template-list">
          <div class="template-card skeleton-card" *ngFor="let i of skeletonItems">
            <div class="skeleton-line skeleton-title"></div>
            <div class="skeleton-line skeleton-subject"></div>
            <div class="skeleton-line skeleton-content"></div>
            <div class="skeleton-line skeleton-content short"></div>
          </div>
        </div>
      </ng-container>

      
      <ng-container *ngIf="hasError && !isLoading">
        <div class="empty-state">
          <div class="empty-icon-wrap error-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
          </div>
          <h3>Đã xảy ra lỗi</h3>
          <p>Không thể tải danh sách template. Vui lòng thử lại sau.</p>
        </div>
      </ng-container>

      
      <ng-container *ngIf="!isLoading && !hasError && data.templates">

        
        <div class="template-list" *ngIf="data.templates.length > 0">
          <div class="template-card" *ngFor="let t of data.templates">
            <div class="template-card-header">
              <h3 class="template-name">{{ t.templateName }}</h3>
              <button class="btn-select" (click)="onSelect(t)">Chọn</button>
            </div>
            <div class="template-card-body">
              <div class="template-meta">
                <span class="meta-label">Tiêu đề:</span>
                <span class="meta-value">{{ t.subject }}</span>
              </div>
              <div class="template-preview">
                <p>{{ t.content }}</p>
              </div>
            </div>
          </div>
        </div>

        
        <div class="empty-state" *ngIf="data.templates.length === 0">
          <div class="empty-icon-wrap">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
              <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
          </div>
          <h3>Không tìm thấy template phù hợp</h3>
          <p>Thử sử dụng từ khóa khác hoặc xóa bộ lọc.</p>
          <button *ngIf="searchControl.value" class="btn-outline" (click)="clearSearch()">
            Xóa tìm kiếm
          </button>
        </div>

      </ng-container>
    </div>
  </div>
</div>
